<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHISA • API - Documentation</title>
    <link rel="icon" href="https://cdn.zass.in/lsXr7NCsX8.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'display': ['Space Grotesk', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #04070f; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.25; }
        .orb-1 { width: 500px; height: 500px; background: #a855f7; top: -150px; left: -150px; }
        .orb-2 { width: 600px; height: 600px; background: #3b82f6; bottom: -200px; right: -200px; }
        .orb-3 { width: 400px; height: 400px; background: #22d3ee; top: 40%; left: 30%; opacity: 0.15; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .glass { background: rgba(13, 20, 37, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        
        .sidebar { transition: transform 0.3s ease; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 40; opacity: 0; pointer-events: none; transition: 0.3s; }
            .sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        }

        .api-row { transition: all 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .api-row:hover, .api-row.active { background: rgba(59, 130, 246, 0.1); border-left-color: #3b82f6; }
        
        .loader { width: 20px; height: 20px; border: 2px solid rgba(59, 130, 246, 0.2); border-top: 2px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-gradient { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transition: 0.3s; }
        .btn-gradient:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(59, 130, 246, 0.8); }
    </style>
</head>
<body class="antialiased min-h-screen flex overflow-hidden relative">

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="loadingScreen" class="fixed inset-0 z-[9999] bg-[#04070f] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="loader mb-4 !w-12 !h-12 !border-4"></div>
        <p class="text-slate-400 text-sm font-display animate-pulse tracking-widest uppercase">System Ready...</p>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay lg:hidden"></div>

    <aside id="sidebar" class="sidebar fixed lg:relative top-0 left-0 bottom-0 w-[280px] bg-[#0a1020] border-r border-slate-800 z-50 flex flex-col h-full shrink-0 shadow-2xl">
        <div class="h-16 flex items-center justify-between px-5 border-b border-slate-800 shrink-0">
            <a href="index.html" class="text-lg font-bold font-display tracking-wide text-white hover:text-blue-400 transition-colors">
                <i class="fas fa-chevron-left text-xs mr-1"></i> CHISA API
            </a>
            <button onclick="toggleSidebar()" class="lg:hidden text-slate-400 hover:text-white p-2">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="p-4 border-b border-slate-800">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Cari API..." class="w-full bg-[#04070f] border border-slate-700 text-xs rounded-lg pl-8 pr-3 py-2 text-white focus:outline-none focus:border-blue-500 transition-colors">
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="categoryList">
        </div>

        <div class="p-4 border-t border-slate-800 bg-[#04070f]">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs">C</div>
                <div>
                    <p class="text-xs font-bold text-white">Administrator</p>
                    <p class="text-[10px] text-green-400"><i class="fas fa-circle text-[6px] mr-1"></i> Online</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden w-full relative z-10">
        
        <header class="glass sticky top-0 z-30 flex items-center justify-between px-4 sm:px-6 h-16 shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-300 hover:text-white w-9 h-9 flex items-center justify-center bg-slate-800 rounded-lg">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="hidden sm:block">
                    <h1 class="text-sm font-bold text-white font-display">API Explorer</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-4 text-xs font-mono">
                <div class="flex items-center gap-1.5 bg-slate-800/50 px-2.5 py-1.5 rounded-lg border border-slate-700/50" title="Baterai">
                    <i class="fas fa-battery-full text-green-400" id="batIcon"></i>
                    <span id="batText" class="text-slate-300 hidden sm:inline">--%</span>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-800/50 px-2.5 py-1.5 rounded-lg border border-slate-700/50" title="Jaringan">
                    <i class="fas fa-wifi text-blue-400"></i>
                    <span id="netText" class="text-slate-300 hidden sm:inline">--</span>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-800/50 px-2.5 py-1.5 rounded-lg border border-slate-700/50" title="Waktu">
                    <i class="fas fa-clock text-purple-400"></i>
                    <span id="clockText" class="text-slate-300">--:--</span>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 scroll-smooth relative">
            <div class="max-w-5xl mx-auto w-full pb-10">
                <div id="api-content-area" class="fade-in">
                    <div class="text-center py-20 glass rounded-3xl border border-dashed border-slate-700 mt-4 h-[60vh] flex flex-col items-center justify-center">
                        <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mb-5">
                            <i class="fas fa-hand-pointer text-3xl text-blue-400 animate-bounce"></i>
                        </div>
                        <h3 class="text-white font-bold text-lg mb-2 font-display">Pilih Endpoint</h3>
                        <p class="text-slate-400 text-sm max-w-xs mx-auto">Silakan pilih kategori atau endpoint di menu sebelah kiri untuk mulai mencoba API.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
